# HR Platform On-Premises MVP - Production Docker Compose Specification
# Version: v1.0.0-pilot.1

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: hr-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      POSTGRES_DB: hr_platform_prod
    volumes:
      - hr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hr_platform_prod"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - hr_internal

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: hr-api:v1.0.0-pilot.1
    container_name: hr-api-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT_API: 3001
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/hr_platform_prod?schema=public
      SYSTEM_ENCRYPTION_KEY: ${SYSTEM_ENCRYPTION_KEY:?SYSTEM_ENCRYPTION_KEY is required in .env}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required in .env}
      APP_URL: ${APP_URL:-http://localhost}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/storage/uploads
      BACKUP_LOCAL_PATH: /app/storage/backups
    volumes:
      - hr_media_data:/app/storage/uploads
      - hr_backup_data:/app/storage/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - hr_internal

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: hr-worker:v1.0.0-pilot.1
    container_name: hr-worker-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/hr_platform_prod?schema=public
      SYSTEM_ENCRYPTION_KEY: ${SYSTEM_ENCRYPTION_KEY}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/storage/uploads
    volumes:
      - hr_media_data:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - hr_internal

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: hr-web:v1.0.0-pilot.1
    container_name: hr-web-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - hr_internal

  caddy:
    image: caddy:2.8.4-alpine
    container_name: hr-caddy-prod
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:80:80"
      - "${HOST_BIND_IP:-127.0.0.1}:443:443"
    volumes:
      - ${CADDYFILE_PATH:-./docker/caddy/Caddyfile.loopback}:/etc/caddy/Caddyfile:ro
      - hr_caddy_data:/data
      - hr_caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - hr_internal

volumes:
  hr_postgres_data:
    name: hr_postgres_prod_data
  hr_media_data:
    name: hr_media_prod_data
  hr_backup_data:
    name: hr_backup_prod_data
  hr_caddy_data:
    name: hr_caddy_prod_data
  hr_caddy_config:
    name: hr_caddy_prod_config

networks:
  hr_internal:
    name: hr_mesh_prod_network
    driver: bridge
